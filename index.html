    <!-- Mobile Links Menu (Hidden by default) -->

    <!-- ========================================
         MAIN WORKSPACE
         ======================================== -->

        <!-- ========================================
             TEXT MODE
             ======================================== -->
        <div id="text-container" class="editor-container active">
            <!-- Page Sidebar (Task 5) -->
            <div id="page-sidebar" class="page-sidebar hidden">
                <div class="sidebar-header">
                    <span>Pages</span>
                    <button id="sidebar-close-btn" class="icon-btn"><span

                </div>
                <div id="page-list" class="page-list">
                    <!-- Page items injected here -->
                </div>
            </div>

            <!-- Text Toolbar -->
            <div class="toolbar text-toolbar">
                <div class="tool-group">
                    <select id="font-family" class="tool-select" title="Font Family">
                        <option value="Inter">Inter</option>
                        <option value="Times_New_Roman">Times_New_Roman</option>
                        <option value="Serif">Serif</option>
                        <option value="Monospace">Mono</option>
                        <option value="Sans_Serif">Sans_Serif</option>
                        <option value="Cursive">Cursive</option>
                        <option value="Fantasy">Fantasy</option>
                    </select>
                    <select id="font-size" class="tool-select" title="Font Size">
                        <option value="0">10px </option>
                        <option value="1" selected>12px</option>
                        <option value="2">14px</option>
                        <option value="3">16px</option>
                        <option value="4">18px</option>
                        <option value="5">24px</option>
                    </select>
                </div>

                <div class="tool-divider"></div>

                <div class="tool-group">
                    <button class="tool-btn" data-cmd="bold" title="Bold">

                    <button class="tool-btn" data-cmd="italic" title="Italic">

                    <button class="tool-btn" data-cmd="underline" title="Underline">

                <div class="tool-group">
                    <button id="add-page-btn" class="tool-btn" title="Add Page">

                    </button>
                    <button id="delete-page-btn" class="tool-btn" title="Delete Page">
                        <span class="material-icons-round">delete_sweep</span>
                    </button>
                </div>

                <div class="tool-divider"></div>

                <div class="tool-group">
                    <button class="tool-btn" data-cmd="justifyLeft" title="Align Left">
                        <span class="material-icons-round">format_align_left</span>

                    <button class="tool-btn" data-cmd="justifyCenter" title="Align Center">

                    </button>

                        <span class="material-icons-round">format_align_right</span>
                    </button>
                    <button class="tool-btn" data-cmd="justifyFull" title="Justify">
                        <span class="material-icons-round">format_align_justify</span>
                    </button>
                </div>

                <div class="tool-divider"></div>

                <div class="tool-group">
                    <button class="tool-btn" data-cmd="insertUnorderedList" title="Bullet List">
                        <span class="material-icons-round">format_list_bulleted</span>

                    <button class="tool-btn" data-cmd="insertOrderedList" title="Numbered List">

                    </button>
                    <button class="tool-btn" data-cmd="indent" title="Indent">
                        <span class="material-icons-round">format_indent_increase</span>
                    </button>
                    <button class="tool-btn" data-cmd="outdent" title="Outdent">

                    </button>
                </div>

                <div class="tool-group">
                    <button id="clear-text-btn" class="tool-btn danger" title="Clear All Text">

            <!-- The Page -->

             CANVAS MODE
             ======================================== -->

                        <option> More are in full version of this project</option>

                <div class="tool-divider"></div>

                <div class="tool-group">

                <div class="tool-group">

                        </button>
                        <button class="stroke-btn" data-size="10" title="Large">

                        <button class="stroke-btn" data-size="20" title="X-Large">

                <div class="tool-divider"></div>

                <div class="tool-group">

                    </button>
                    <button class="tool-btn shape-btn" data-shape="star" title="Star">

                    </button>

                    </button>
                    <button class="tool-btn shape-btn" data-shape="arrow" title="Arrow">

                <div class="tool-divider"></div>

        <div
            style="border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; color: #666; font-family: sans-serif; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold; font-size: 14px;">SyncPad Mini</span>

    <!-- Download Modal (Hidden by default) -->
    <div id="download-modal" class="download-modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <h3>Choose what to download</h3>
            <div class="modal-buttons">
                <button id="download-text-btn" class="modal-option-btn">
                    <span class="material-icons-round">article</span>
                    <span>Download Text</span>
                </button>
                <button id="download-canvas-btn" class="modal-option-btn">
                    <span class="material-icons-round">draw</span>
                    <span>Download Canvas</span>
                </button>
            </div>
            <button id="modal-close-btn" class="modal-close-btn">Cancel</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log("SyncPad Script Loaded");

            // --- State ---
            let currentMode = 'text';
            const state = {
                canvas: {
                    isDrawing: false,
                    isDirty: false,
                    tool: 'brush',
                    brushType: 'pen',
                    color: '#000000',
                    size: 5,
                    startX: 0,
                    startY: 0,
                    snapshot: null,
                    floatingImage: null
                }
            };
            const dom = {
                nav: {
                    linksBtn: document.getElementById('links-btn'),
                    mobileMenu: document.getElementById('mobile-menu'),
                    downloadBtn: document.getElementById('download-btn'),
                },
                mode: {
                    btns: document.querySelectorAll('.mode-btn'),
                    containers: {
                        text: document.getElementById('text-container'),
                        canvas: document.getElementById('canvas-container')
                    }
                },
                text: {
                    editor: document.getElementById('editor'),
                    toolbar: document.querySelector('.text-toolbar'),
                    fontFamily: document.getElementById('font-family'),
                    fontSize: document.getElementById('font-size'),
                    textColor: document.getElementById('text-color'),
                    highlightColor: document.getElementById('highlight-color'),
                    clearBtn: document.getElementById('clear-text-btn'),
                    cmdBtns: document.querySelectorAll('.text-toolbar .tool-btn[data-cmd]'),
                    imgBtn: document.getElementById('text-img-btn'),
                    imgInput: document.getElementById('text-img-input')
                },
                canvas: {
                    element: document.getElementById('drawing-canvas'),
                    ctx: document.getElementById('drawing-canvas').getContext('2d'),
                    wrapper: document.querySelector('.canvas-wrapper'),

                    brushTypeSelect: document.getElementById('brush-type'),
                    brushBtn: document.getElementById('tool-brush'),
                    eraserBtn: document.getElementById('tool-eraser'),
                    shapeBtns: document.querySelectorAll('.shape-btn'),

                    // New Stroke UI
                    strokeBtns: document.querySelectorAll('.stroke-btn'),

                    colorInput: document.getElementById('stroke-color'),
                    clearBtn: document.getElementById('clear-canvas-btn'),

                    imgBtn: document.getElementById('canvas-img-btn'),
                    imgInput: document.getElementById('canvas-img-input')
                }
            };

            // --- Initialization ---
            function init() {
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);

                // Robust Resize: Observer
                if (window.ResizeObserver) {
                    const ro = new ResizeObserver(() => {
                        // Determine if visible
                        if (dom.canvas.wrapper.offsetParent !== null) {
                            resizeCanvas();
                        }
                    });
                    ro.observe(dom.canvas.wrapper);
                }

                // Before Unload Warning
                window.addEventListener('beforeunload', (e) => {
                    e.preventDefault();
                    e.returnValue = 'Data will be lost!';
                });

                // --- Manual Page Management ---
                const editorContainer = document.getElementById('editor');
                const addPageBtn = document.getElementById('add-page-btn');
                const deletePageBtn = document.getElementById('delete-page-btn');

                function createNewPage() {
                    const page = document.createElement('div');
                    page.className = 'document-page';
                    page.contentEditable = true;
                    page.innerHTML = '<p><br></p>';
                    return page;
                }

                function getActivePage() {
                    const sel = window.getSelection();
                    if (!sel.rangeCount) return null;
                    let node = sel.anchorNode;
                    if (node.nodeType !== 1) node = node.parentElement;
                    return node.closest('.document-page');
                }

                // ADD PAGE
                addPageBtn.addEventListener('click', () => {
                    const activePage = getActivePage();
                    const newPage = createNewPage();

                    if (activePage && activePage.nextSibling) {
                        editorContainer.insertBefore(newPage, activePage.nextSibling);
                    } else if (activePage) {
                        editorContainer.appendChild(newPage);
                    } else {
                        // If no active page (e.g. lost focus), append to end
                        editorContainer.appendChild(newPage);
                    }

                    // Focus new page
                    newPage.focus();
                    initializeCaret(newPage);
                });

                // DELETE PAGE
                deletePageBtn.addEventListener('click', () => {
                    const pages = editorContainer.querySelectorAll('.document-page');
                    if (pages.length <= 1) {
                        alert("Cannot delete the only page.");
                        return;
                    }

                    const activePage = getActivePage();
                    if (activePage) {
                        if (confirm('Delete this page permanently?')) {
                            const prev = activePage.previousElementSibling;
                            const next = activePage.nextElementSibling;
                            activePage.remove();

                            if (prev) {
                                prev.focus();
                                // Move cursor to end of prev page
                            } else if (next) {
                                next.focus();
                            }
                        }
                    } else {
                        alert("Click inside a page to select it for deletion.");
                    }
                });

                function initializeCaret(page) {
                    const range = document.createRange();
                    const p = page.querySelector('p');
                    if (p) {
                        range.setStart(p, 0);
                        range.collapse(true);
                        const sel = window.getSelection();
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                }
                // -----------------------------

                // --- Caret Initialization & Focus UX ---
                // Ensure every page starts with a paragraph so caret placement works
                editorContainer.addEventListener('click', (e) => {
                    // if user clicks the gray area, focus the last page
                    if (e.target === editorContainer) {
                        const lastPage = editorContainer.lastElementChild;
                        if (lastPage) lastPage.focus();
                    }
                });

                // Enforce block element on focus
                document.addEventListener('selectionchange', () => {
                    const sel = document.getSelection();
                    if (!sel.rangeCount) return;
                    const node = sel.anchorNode;
                    // Check if we are inside a document page
                    let p = node.nodeType === 3 ? node.parentElement : node;
                    const page = p.closest('.document-page');

                    if (page && page.innerHTML.trim() === '') {
                        // If page is empty, insert paragraph
                        page.innerHTML = '<p><br></p>';
                        // Restore focus
                        const range = document.createRange();
                        const pTag = page.querySelector('p');
                        range.setStart(pTag, 0);
                        range.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                });
                // -----------------------------
            }

            // --- UI Logic ---

            // Mobile Menu
            dom.nav.linksBtn.addEventListener('click', () => {
                dom.nav.mobileMenu.classList.toggle('hidden');
            });

            // Listen for canvas mode activation from main.js
            window.addEventListener('canvasModeActivated', () => {
                setTimeout(resizeCanvas, 50);
            });




            // --- Canvas Logic ---

            function resizeCanvas() {
                // Save current content
                const dataUrl = dom.canvas.element.toDataURL();
                const img = new Image();
                img.src = dataUrl;

                // Resize
                const rect = dom.canvas.wrapper.getBoundingClientRect();
                dom.canvas.element.width = rect.width;
                dom.canvas.element.height = rect.height;

                // Restore content
                img.onload = () => {
                    dom.canvas.ctx.drawImage(img, 0, 0);
                };
                // Re-set styles
                updateCanvasContext();
            }

            function updateCanvasContext() {
                const ctx = dom.canvas.ctx;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = state.canvas.size;

                if (state.canvas.tool === 'eraser') {
                    ctx.strokeStyle = '#ffffff';
                    ctx.globalAlpha = 1.0;
                } else {
                    ctx.strokeStyle = state.canvas.color;

                    // Brush styles
                    if (state.canvas.tool === 'brush') {
                        if (state.canvas.brushType === 'pen') {
                            ctx.globalAlpha = 1.0;
                            ctx.lineCap = 'round';
                        } else if (state.canvas.brushType === 'marker') {
                            ctx.globalAlpha = 0.5;
                            ctx.lineCap = 'square';
                        } else if (state.canvas.brushType === 'pencil') {
                            ctx.globalAlpha = 0.8;
                        }
                    } else {
                        // Shapes
                        ctx.globalAlpha = 1.0;
                    }
                }
            }

            // Tool Selection
            dom.canvas.brushTypeSelect.addEventListener('change', (e) => {
                state.canvas.brushType = e.target.value;
                setCanvasTool('brush'); // switch to brush if not already
            });

            dom.canvas.brushBtn.addEventListener('click', () => setCanvasTool('brush'));
            dom.canvas.eraserBtn.addEventListener('click', () => setCanvasTool('eraser'));

            // Robust Shape Listener Attachment
            const shapeButtons = document.querySelectorAll('.shape-btn');
            console.log("Found shape buttons for binding:", shapeButtons.length);
            shapeButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    console.log("Shape Clicked:", btn.dataset.shape);
                    setCanvasTool(btn.dataset.shape);
                });
            });

            function setCanvasTool(tool) {
                console.log("SetCanvasTool:", tool);
                state.canvas.tool = tool;

                // Update UI
                dom.canvas.brushBtn.classList.toggle('active', tool === 'brush');
                dom.canvas.eraserBtn.classList.toggle('active', tool === 'eraser');
                dom.canvas.shapeBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.shape === tool);
                });

                // Cursor logic
                dom.canvas.element.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
                updateCanvasContext();
            }

            // Stroke Size (Visual Buttons)
            dom.canvas.strokeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // UI Update
                    dom.canvas.strokeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    // State Update
                    state.canvas.size = parseInt(btn.dataset.size);
                    updateCanvasContext();
                });
            });

            // Color Feedback
            dom.canvas.colorInput.addEventListener('input', (e) => {
                state.canvas.color = e.target.value;
                // Update the icon next to it to show the color
                const wrapper = dom.canvas.colorInput.parentElement;
                const icon = wrapper.querySelector('.color-icon');
                if (icon) {
                    icon.style.color = e.target.value;
                }
                updateCanvasContext();
            });

            // Clear Canvas - with preventDefault for Chrome compatibility
            dom.canvas.clearBtn.addEventListener('click', (e) => {
                e.preventDefault(); // Prevent Chrome from auto-dismissing confirm dialog
                if (confirm('Clear entire drawing?')) {
                    dom.canvas.ctx.clearRect(0, 0, dom.canvas.element.width, dom.canvas.element.height);
                    state.canvas.isDirty = false;
                }
            });

            // Canvas Image Logic (Floating Div)
            dom.canvas.imgBtn.addEventListener('click', () => dom.canvas.imgInput.click());
            dom.canvas.imgInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (red) => {
                        createFloatingImage(red.target.result);
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            });

            function createFloatingImage(src) {
                if (state.canvas.floatingImage) {
                    state.canvas.floatingImage.remove(); // Only one at a time for simplicity
                }

                const container = document.createElement('div');
                container.className = 'canvas-image-container';
                container.style.left = '50px';
                container.style.top = '50px';

                const img = new Image();
                img.src = src;

                const controls = document.createElement('div');
                controls.className = 'canvas-image-controls';

                const stampBtn = document.createElement('button');
                stampBtn.className = 'canvas-stamp-btn';
                stampBtn.innerText = 'Stamp';

                // Stamp Logic
                stampBtn.onclick = () => {
                    const rect = dom.canvas.element.getBoundingClientRect();
                    const contRect = container.getBoundingClientRect();

                    // Calculate relative position to canvas
                    const x = contRect.left - rect.left + 5; // +5 padding
                    const y = contRect.top - rect.top + 5;
                    const w = img.width; // current rendered width
                    const h = img.height;

                    // Draw to canvas
                    const ctx = dom.canvas.ctx;
                    ctx.globalAlpha = 1.0;
                    ctx.drawImage(img, x, y, img.getBoundingClientRect().width, img.getBoundingClientRect().height);

                    state.canvas.isDirty = true;

                    container.remove();
                    state.canvas.floatingImage = null;
                };

                controls.appendChild(stampBtn);
                container.appendChild(img);
                container.appendChild(controls);
                dom.canvas.wrapper.appendChild(container);

                state.canvas.floatingImage = container;

                // Basic Drag Logic
                let isDragging = false;
                let diffX = 0, diffY = 0;

                container.addEventListener('mousedown', (e) => {
                    if (e.target === stampBtn) return;
                    isDragging = true;
                    const rect = container.getBoundingClientRect();
                    diffX = e.clientX - rect.left;
                    diffY = e.clientY - rect.top;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    container.style.left = (e.clientX - diffX - dom.canvas.wrapper.getBoundingClientRect().left) + 'px';
                    container.style.top = (e.clientY - diffY - dom.canvas.wrapper.getBoundingClientRect().top) + 'px';
                });

                window.addEventListener('mouseup', () => {
                    isDragging = false;
                });
            }


            // Drawing Events
            const canvas = dom.canvas.element;
            const ctx = dom.canvas.ctx;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                return { x, y };
            };

            const startDraw = (e) => {
                if (e.cancelable) e.preventDefault(); // Prevent scrolling/emulation and text selection

                if (e.type !== 'mousedown' && e.type !== 'touchstart') return;

                console.log(`StartDraw: ${e.type} at ${e.clientX || e.touches[0].clientX}, ${e.clientY || e.touches[0].clientY}`);

                state.canvas.isDrawing = true;
                state.canvas.isDirty = true;

                const { x, y } = getPos(e);
                state.canvas.startX = x;
                state.canvas.startY = y;

                // Force round caps for smooth drawing
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(x, y);

                // Snapshot for shapes
                if (['rect', 'circle', 'tri', 'star', 'line', 'arrow'].includes(state.canvas.tool)) {
                    state.canvas.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
                } else {
                    // Dot for single click
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
            };

            // Draw Function (Standard Path)
            const draw = (e) => {
                if (!state.canvas.isDrawing) return;
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();

                const { x, y } = getPos(e);

                // Debug
                console.log(`Draw: ${state.canvas.tool} | ${e.type} | ${x},${y}`);

                if (state.canvas.tool === 'brush' || state.canvas.tool === 'eraser') {
                    ctx.lineTo(x, y);
                    ctx.stroke();
                } else if (['rect', 'circle', 'tri', 'star', 'line', 'arrow'].includes(state.canvas.tool)) {
                    // Restore snapshot
                    ctx.putImageData(state.canvas.snapshot, 0, 0);
                    ctx.beginPath();

                    const w = x - state.canvas.startX;
                    const h = y - state.canvas.startY;

                    if (state.canvas.tool === 'rect') {
                        ctx.rect(state.canvas.startX, state.canvas.startY, w, h);
                    } else if (state.canvas.tool === 'circle') {
                        const r = Math.sqrt(w * w + h * h);
                        ctx.arc(state.canvas.startX, state.canvas.startY, r, 0, 2 * Math.PI);
                    } else if (state.canvas.tool === 'line') {
                        ctx.moveTo(state.canvas.startX, state.canvas.startY);
                        ctx.lineTo(x, y);
                    } else if (state.canvas.tool === 'tri') {
                        ctx.moveTo(state.canvas.startX + w / 2, state.canvas.startY);
                        ctx.lineTo(state.canvas.startX, state.canvas.startY + h);
                        ctx.lineTo(state.canvas.startX + w, state.canvas.startY + h);
                        ctx.closePath();
                    } else if (state.canvas.tool === 'star') {
                        const r = Math.sqrt(w * w + h * h);
                        const spikes = 5;
                        const outerRadius = r;
                        const innerRadius = r / 2;
                        let rot = Math.PI / 2 * 3;
                        let cx = state.canvas.startX;
                        let cy = state.canvas.startY;
                        const step = Math.PI / spikes;

                        ctx.moveTo(cx, cy - outerRadius);
                        for (let i = 0; i < spikes; i++) {
                            cx = state.canvas.startX + Math.cos(rot) * outerRadius;
                            cy = state.canvas.startY + Math.sin(rot) * outerRadius;
                            ctx.lineTo(cx, cy);
                            rot += step;

                            cx = state.canvas.startX + Math.cos(rot) * innerRadius;
                            cy = state.canvas.startY + Math.sin(rot) * innerRadius;
                            ctx.lineTo(cx, cy);
                            rot += step;
                        }
                        ctx.closePath();
                    } else if (state.canvas.tool === 'arrow') {
                        const headLen = 15;
                        const angle = Math.atan2(h, w);
                        ctx.moveTo(state.canvas.startX, state.canvas.startY);
                        ctx.lineTo(x, y);
                        // Arrow head
                        ctx.lineTo(x - headLen * Math.cos(angle - Math.PI / 6), y - headLen * Math.sin(angle - Math.PI / 6));
                        ctx.moveTo(x, y);
                        ctx.lineTo(x - headLen * Math.cos(angle + Math.PI / 6), y - headLen * Math.sin(angle + Math.PI / 6));
                    }
                    ctx.stroke();
                }
            };

            // Stop Draw
            const stopDraw = () => {
                if (state.canvas.isDrawing) {
                    console.log("Stop Draw");
                    state.canvas.isDrawing = false;
                    ctx.beginPath();
                }
            };

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            // canvas.addEventListener('mouseout', stopDraw); // POTENTIAL BUG SOURCE

            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDraw);

            // --- PDF Export with Smart Logic ---

            // Helper Functions
            function hasTextContent() {
                const textContent = dom.text.editor.innerText.trim();
                const placeholder = 'Start typing here...SYNCPAD_MINI by parveenengg';
                const cleanText = textContent.replace(/\s+/g, '');
                const cleanPlaceholder = placeholder.replace(/\s+/g, '');

                return textContent.length > 0 && cleanText !== cleanPlaceholder && textContent !== 'Start typing here...';
            }

            function hasCanvasContent() {
                const hasFloating = !!state.canvas.floatingImage;
                return state.canvas.isDirty || hasFloating;
            }

            function downloadTextPDF() {
                try {
                    const header = document.getElementById('pdf-header');
                    if (!header) {
                        console.error('PDF Header element (#pdf-header) not found!');
                        alert('Error: PDF Header template is missing. Cannot generate PDF.');
                        return;
                    }

                    const content = dom.text.editor.cloneNode(true);

                    // --- PDF Visual Fixes (Export Only) ---
                    content.style.background = '#ffffff';
                    content.style.backgroundImage = 'none';
                    content.style.boxShadow = 'none';
                    content.style.padding = '30px'; // Consistent export padding

                    // Remove trailing empty elements to reduce extra pages
                    const children = Array.from(content.children);
                    for (let i = children.length - 1; i >= 0; i--) {
                        const child = children[i];
                        const text = child.innerText.trim();
                        if (!text && child.tagName !== 'IMG' && child.tagName !== 'HR') {
                            child.remove();
                        } else {
                            break; // Stop at first non-empty element
                        }
                    }
                    // --------------------------------------

                    const wrapper = document.createElement('div');
                    wrapper.style.padding = "0px"; // Wrapper padding moved to content
                    wrapper.appendChild(content);

                    // Append footer (header logic was requested but code shows footer logic here previously? 
                    // Wait, the prompt said "header logic". Let's inspect the code I read earlier.)
                    // Ah, the code I read has `const footer = document.getElementById('pdf-footer');`.
                    // But the USER said "PDF Header". 
                    // Code in line 785 says `const footer = document.getElementById('pdf-footer');`.
                    // BUT line 297 in index.html defines `#pdf-header`.
                    // I will perform a SAFE update to use the existing logic structure but safely check for elements.

                    // Re-reading code I saw earlier in 'view_file' output for index.html:
                    // Line 785: const footer = document.getElementById('pdf-footer');
                    // Line 792: const footerClone = footer.cloneNode(true);

                    // I will wrap THIS logic safely.
                    const footer = document.getElementById('pdf-footer');
                    if (footer) {
                        const footerClone = footer.cloneNode(true);
                        footerClone.classList.remove('hidden');
                        footerClone.style.marginTop = "50px";
                        footerClone.style.textAlign = "right";
                        footerClone.style.fontFamily = "sans-serif";
                        footerClone.style.color = "#777";
                        footerClone.style.fontSize = "12px";
                        wrapper.appendChild(footerClone);
                    } else {
                        console.warn('PDF Footer element not found, skipping footer.');
                    }

                    const opt = {
                        margin: 0.5,
                        filename: `SyncPad_Text_${new Date().toISOString().slice(0, 10)}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2 },
                        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                    };

                    html2pdf().set(opt).from(wrapper).save().catch(err => {
                        console.error('PDF generation error (html2pdf):', err);
                        alert(`Failed to generate PDF: ${err.message || err}`);
                    });
                } catch (error) {
                    console.error('Error in downloadTextPDF:', error);
                    alert(`An error occurred while preparing the Text PDF:\n${error.message}`);
                }
            }

            function downloadCanvasPDF() {
                try {
                    if (!dom.canvas || !dom.canvas.element) {
                        throw new Error("Canvas element not found in DOM");
                    }

                    const footer = document.getElementById('pdf-footer');
                    const wrapper = document.createElement('div');

                    const img = new Image();
                    // Wrap toDataURL in try catch as it can fail with tainted canvas
                    try {
                        img.src = dom.canvas.element.toDataURL('image/png');
                    } catch (e) {
                        throw new Error("Failed to export canvas image (Tainted?): " + e.message);
                    }
                    img.style.width = "100%";

                    if (footer) {
                        const footerClone = footer.cloneNode(true);
                        footerClone.classList.remove('hidden');
                        footerClone.style.marginTop = "20px";
                        footerClone.style.textAlign = "right";
                        footerClone.style.fontFamily = "sans-serif";
                        footerClone.style.color = "#777";
                        footerClone.style.fontSize = "12px";
                        wrapper.appendChild(footerClone);
                    } else {
                        console.warn("PDF Footer not found, skipping.");
                    }

                    wrapper.insertBefore(img, wrapper.firstChild); // Ensure image is first

                    const opt = {
                        margin: 0.5,
                        filename: `SyncPad_Canvas_${new Date().toISOString().slice(0, 10)}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2 },
                        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                    };

                    img.onload = () => {
                        html2pdf().set(opt).from(wrapper).save().catch(err => {
                            console.error('PDF generation error (html2pdf):', err);
                            alert(`Failed to generate Canvas PDF: ${err.message || err}`);
                        });
                    };

                    img.onerror = () => {
                        console.error("Canvas image load error");
                        alert('Failed to load canvas image for PDF generation.');
                    };
                } catch (error) {
                    console.error('Error in downloadCanvasPDF:', error);
                    alert(`An error occurred while preparing the Canvas PDF:\n${error.message}`);
                }
            }

            // Modal Logic
            const modal = document.getElementById('download-modal');
            const modalOverlay = modal.querySelector('.modal-overlay');
            const downloadTextBtn = document.getElementById('download-text-btn');
            const downloadCanvasBtn = document.getElementById('download-canvas-btn');
            const modalCloseBtn = document.getElementById('modal-close-btn');

            function showModal() {
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Prevent scrolling
            }

            function hideModal() {
                modal.classList.add('hidden');
                document.body.style.overflow = ''; // Restore scrolling
            }

            // Modal event listeners
            downloadTextBtn.addEventListener('click', () => {
                hideModal();
                downloadTextPDF();
            });

            downloadCanvasBtn.addEventListener('click', () => {
                hideModal();
                downloadCanvasPDF();
            });

            modalCloseBtn.addEventListener('click', hideModal);
            modalOverlay.addEventListener('click', hideModal);

            // ESC key to close modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                    hideModal();
                }
            });

            // Main Download Button Logic
            dom.nav.downloadBtn.addEventListener('click', () => {
                const hasText = hasTextContent();
                const hasCanvas = hasCanvasContent();

                console.log('Download clicked - Text:', hasText, 'Canvas:', hasCanvas);

                if (!hasText && !hasCanvas) {
                    alert('No data to download! Please add some text or drawings first.');
                    return;
                }

                if (hasText && hasCanvas) {
                    // Both have data - show modal
                    showModal();
                } else if (hasText) {
                    // Only text has data
                    downloadTextPDF();
                } else if (hasCanvas) {
                    // Only canvas has data
                    downloadCanvasPDF();
                }
            });

            // Go!
            init();
        });
    </script>
