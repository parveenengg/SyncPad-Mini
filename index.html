<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncPad - Collaborative Notepad</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Mobile UI Elements (Global) -->
    <div class="mobile-top-bar mobile-only">
        <button class="icon-btn" onclick="goBack()" title="Back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <div class="mobile-actions">
            <!-- Undo/Redo -->
            <button class="icon-btn" onclick="undo()" title="Undo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7v6h6"></path>
                    <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                </svg>
            </button>
            <button class="icon-btn" onclick="redo()" title="Redo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 7v6h-6"></path>
                    <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
                </svg>
            </button>
            <!-- Format "A" -->
            <button class="icon-btn" onclick="openStyleMenu()" title="Format">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 7V4h16v3"></path>
                    <path d="M9 20h6"></path>
                    <path d="M12 4v16"></path>
                </svg>
            </button>
            <!-- Insert "+" -->
            <button class="icon-btn" onclick="openInsertMenu()" title="Insert">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <button class="icon-btn" onclick="openMoreMenu()" title="More">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="12" cy="5" r="1"></circle>
                    <circle cx="12" cy="19" r="1"></circle>
                </svg>
            </button>
        </div>
    </div>

    <div class="mobile-bottom-bar mobile-only">
        <div class="mobile-font-toggles">
            <button class="icon-btn" onclick="toggleFormat('bold')" id="boldBtnMobile">
                <b>B</b>
            </button>
            <button class="icon-btn" onclick="toggleFormat('italic')" id="italicBtnMobile">
                <i>I</i>
            </button>
            <button class="icon-btn" onclick="toggleFormat('underline')" id="underlineBtnMobile">
                <u>U</u>
            </button>
            <button class="icon-btn" onclick="openColorPicker()" id="colorBtnMobile">
                <span style="color: var(--accent-color); font-weight: bold;">A</span>
            </button>
            <button class="icon-btn" onclick="toggleAlignment()" id="alignBtnMobile">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="21" y1="10" x2="3" y2="10"></line>
                    <line x1="21" y1="6" x2="3" y2="6"></line>
                    <line x1="21" y1="14" x2="3" y2="14"></line>
                    <line x1="21" y1="18" x2="3" y2="18"></line>
                </svg>
            </button>
            <button class="icon-btn" onclick="document.execCommand('insertUnorderedList')" title="Bullets">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile Modals -->
    <div id="insertMenuModal" class="mobile-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-item" onclick="insertLink()">Link</div>
            <div class="modal-item" onclick="insertImage()">Image</div>
            <div class="modal-item" onclick="insertTable()">Table</div>
            <div class="modal-item" onclick="insertHorizontalLine()">Horizontal Line</div>
            <div class="modal-item" onclick="insertPageBreak()">Page Break</div>
            <div class="modal-item" onclick="insertPageNumber()">Page Number</div>
            <div class="modal-item" onclick="closeInsertMenu()">Cancel</div>
        </div>
    </div>

    <div id="styleMenuModal" class="mobile-modal" style="display: none;">
        <div class="modal-content">
            <h3>Style</h3>
            <div class="modal-item" onclick="formatBlock('P')">Normal Text</div>
            <div class="modal-item" onclick="formatBlock('H1')">Title</div>
            <div class="modal-item" onclick="formatBlock('H2')">Subtitle</div>
            <div class="modal-item" onclick="formatBlock('H3')">Heading 1</div>
            <div class="modal-item" onclick="formatBlock('H4')">Heading 2</div>
            <div class="modal-item" onclick="closeStyleMenu()">Cancel</div>
        </div>
    </div>

    <!-- Home Page -->
    <div id="homePage">
        <!-- Navbar -->
        <nav class="navbar desktop-only">
            <div class="navbar-left">
                <a href="https://github.com/parveenengg" target="_blank" rel="noopener noreferrer" class="nav-link">
                    <span class="nav-icon">🔗</span>
                    <span class="nav-text">GitHub</span>
                </a>
                <a href="https://parveenengg.github.io/parveenkumar/index.html" target="_blank"
                    rel="noopener noreferrer" class="nav-link">
                    <span class="nav-icon">P</span>
                    <span class="nav-text">Portfolio</span>
                </a>
            </div>
            <!-- Navbar Center -->
            <div class="navbar-center" onclick="goToCollab()">
                SyncPad
            </div>

            <!-- Navbar Right -->
            <div class="navbar-right">
                <!-- Buttons moved to menu bar -->
            </div>
        </nav>

        <!-- Menu Bar -->
        <div class="menu-bar">
            <div class="mode-toggle">
                <button class="mode-btn active" onclick="switchMode('text', this)">Text</button>
                <button class="mode-btn" onclick="switchMode('draw', this)">Canvas</button>
            </div>

            <div class="menu-separator"></div>

            <!-- Action Buttons (New Location) -->
            <button class="icon-btn" onclick="downloadPDF()" title="Download PDF" aria-label="Download PDF">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </button>

            <button class="icon-btn" onclick="clearContent()" title="Clear Page" aria-label="Clear Page">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
            </button>

            <div class="menu-separator"></div>

            <!-- Shape Tools (Text Mode - Drawing Objects) -->
            <div class="shape-tools text-control">
                <button class="icon-btn shape-btn" onclick="selectDrawTool('freehand')" title="Draw Object">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 19l7-7 3 3-7 7-3-3z" />
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
                    </svg>
                </button>
                <button class="icon-btn shape-btn" onclick="selectDrawTool('rectangle')" title="Rectangle Object">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                    </svg>
                </button>
                <button class="icon-btn shape-btn" id="circleBtn" onclick="selectDrawTool('circle')"
                    title="Circle Object">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9" />
                    </svg>
                </button>
            </div>

            <div class="shape-tools draw-control" style="display: none;">
                <!-- Full Canvas Tools -->
                <button class="icon-btn shape-btn active" id="freehandBtnCanvas" onclick="selectDrawTool('freehand')"
                    title="Freehand">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 19l7-7 3 3-7 7-3-3z" />
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
                    </svg>
                </button>
            </div>

            <div class="menu-separator draw-control" style="display: none;"></div>

            <!-- Font Size Controls (Text Mode Only) -->
            <div class="font-size-control text-control">
                <button class="icon-btn" onclick="changeFontSize(-1)" aria-label="Decrease font size">−</button>
                <span class="font-size-display" id="fontSizeDisplay" onclick="showFontSizePicker()">14</span>
                <button class="icon-btn" onclick="changeFontSize(1)" aria-label="Increase font size">+</button>
            </div>

            <select class="menu-select text-control" id="fontFamily" onchange="applyFormatting()">
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Inter', sans-serif">Inter</option>
                <option value="'Arial', sans-serif">Arial</option>
            </select>

            <div class="menu-separator"></div>

            <!-- Text Formatting Buttons (Text Mode Only) -->
            <button class="icon-btn format-btn text-control" id="boldBtn" onclick="toggleFormat('bold')"
                aria-label="Bold">B</button>
            <button class="icon-btn format-btn text-control" id="italicBtn" onclick="toggleFormat('italic')"
                aria-label="Italic">I</button>
            <button class="icon-btn format-btn text-control" id="underlineBtn" onclick="toggleFormat('underline')"
                aria-label="Underline">U</button>

            <div class="menu-separator"></div>

            <!-- Stroke Size Control (Draw Mode Only) -->
            <div class="stroke-size-control draw-control" style="display: none;">
                <button class="icon-btn" onclick="changeStrokeSize(-1)" aria-label="Decrease stroke size">−</button>
                <span class="stroke-size-display" id="strokeSizeDisplay">3</span>
                <button class="icon-btn" onclick="changeStrokeSize(1)" aria-label="Increase stroke size">+</button>
            </div>

            <!-- Color Picker (Circles) -->
            <div class="color-picker">
                <button class="color-circle" data-color="black" onclick="selectColor('black')"
                    style="background: black;" aria-label="Black"></button>
                <button class="color-circle" data-color="red" onclick="selectColor('red')" style="background: red;"
                    aria-label="Red"></button>
                <button class="color-circle" data-color="blue" onclick="selectColor('blue')" style="background: blue;"
                    aria-label="Blue"></button>
                <button class="color-circle" data-color="green" onclick="selectColor('green')"
                    style="background: green;" aria-label="Green"></button>
            </div>

            <div class="menu-separator"></div>

            <!-- Alignment Buttons (Text Mode Only) -->
            <div class="align-controls text-control">
                <button class="icon-btn align-btn active" id="alignLeft" onclick="setAlignment('left')"
                    aria-label="Align Left" title="Align Left">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 3h12M2 6h12M2 9h8M2 12h12" stroke="#5f6368" stroke-width="1.5"
                            stroke-linecap="round" />
                    </svg>
                </button>
                <button class="icon-btn align-btn" id="alignCenter" onclick="setAlignment('center')"
                    aria-label="Align Center" title="Align Center">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 3h12M4 6h8M2 9h12M4 12h8" stroke="#5f6368" stroke-width="1.5"
                            stroke-linecap="round" />
                    </svg>
                </button>
                <button class="icon-btn align-btn" id="alignRight" onclick="setAlignment('right')"
                    aria-label="Align Right" title="Align Right">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 3h12M2 6h12M6 9h8M2 12h12" stroke="#5f6368" stroke-width="1.5"
                            stroke-linecap="round" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Editor Container -->
        <div class="container">
            <div class="page-wrapper">
                <!-- Text Editor -->
                <div id="textEditor" contenteditable="true" class="text-editor a4-page" spellcheck="false"></div>

                <!-- Drawing Canvas -->
                <div id="canvasContainer" style="display: none;">
                    <canvas id="drawingCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Collaborative Page -->
    <div id="collabPage" class="collab-page">
        <!-- Navbar -->
        <nav class="navbar">
            <!-- Navbar Left -->
            <div class="navbar-left">
                <!-- User List Toggle (Mobile) -->
                <button class="nav-btn user-toggle-btn" onclick="toggleMobileUsers()">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text" id="userCountMobile">1</span>
                </button>
                <a href="#" class="nav-link" onclick="goToHome()" title="Back to Home">
                    <span class="nav-icon">🏠</span>
                </a>
            </div>

            <!-- Navbar Center -->
            <div class="navbar-center" id="roomIdDisplay" title="Click to copy link" onclick="copyRoomLink()">
                SyncPad (Link)
            </div>

            <!-- Navbar Right -->
            <div class="navbar-right">
                <!-- Buttons are now in Menu Bar -->
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="collab-layout">
            <!-- Left Side: User List -->
            <div class="collab-sidebar">
                <div class="share-link-container">
                    <button class="copy-link-btn" onclick="copyLink(this)">
                        <span class="btn-icon">📋</span>
                        <span class="btn-text">Copy Link</span>
                    </button>
                </div>

                <div class="online-users">
                    <h3 class="users-title-desktop">Online Users</h3>
                    <div class="user-list-desktop">
                        <div class="user-item">
                            <div class="user-circle user-black"></div>
                            <input type="text" class="user-name-input" placeholder="Your name" maxlength="20">
                        </div>
                        <div class="user-item">
                            <div class="user-circle user-red"></div>
                            <input type="text" class="user-name-input" placeholder="Name" maxlength="20">
                        </div>
                        <div class="user-item">
                            <div class="user-circle user-blue"></div>
                            <input type="text" class="user-name-input" placeholder="Name" maxlength="20">
                        </div>
                        <div class="user-item">
                            <div class="user-circle user-green"></div>
                            <input type="text" class="user-name-input" placeholder="Name" maxlength="20">
                        </div>
                    </div>
                    <div class="user-count-mobile">
                        <div class="user-circle-small user-black"></div>
                        <div class="user-circle-small user-red"></div>
                        <div class="user-circle-small user-blue"></div>
                        <div class="user-circle-small user-green"></div>
                        <span class="user-count-text">4</span>
                    </div>
                    <p class="your-color-indicator">Your color: <span id="currentUserColor"
                            style="font-weight: bold;"></span></p>
                    <div class="collab-editor-wrapper">
                        <!-- Menu Bar (Desktop) -->
                        <div class="menu-bar desktop-only">
                            <div class="mode-toggle">
                                <button class="mode-btn active" onclick="switchMode('text', this)">Text</button>
                                <button class="mode-btn" onclick="switchMode('draw', this)">Canvas</button>
                            </div>

                            <div class="menu-separator"></div>

                            <!-- Action Buttons -->
                            <button class="icon-btn" onclick="downloadPDF()" title="Download PDF">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                            </button>
                            <button class="icon-btn" onclick="clearContent()" title="Clear Page">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path
                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                    </path>
                                </svg>
                            </button>

                            <div class="menu-separator"></div>

                            <!-- Desktop Text Controls -->
                            <div class="shape-tools text-control">
                                <button class="icon-btn shape-btn" onclick="selectDrawTool('freehand')"
                                    title="Draw Object">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M12 19l7-7 3 3-7 7-3-3z" />
                                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
                                    </svg>
                                </button>
                                <button class="icon-btn shape-btn" onclick="selectDrawTool('rectangle')"
                                    title="Rectangle Object">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" />
                                    </svg>
                                </button>
                                <button class="icon-btn shape-btn" onclick="selectDrawTool('circle')"
                                    title="Circle Object">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <circle cx="12" cy="12" r="9" />
                                    </svg>
                                </button>
                            </div>

                            <div class="shape-tools draw-control" style="display: none;">
                                <button class="icon-btn shape-btn active" id="freehandBtnCanvasCollab"
                                    onclick="selectDrawTool('freehand')" title="Freehand">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M12 19l7-7 3 3-7 7-3-3z" />
                                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
                                    </svg>
                                </button>
                            </div>

                            <div class="menu-separator draw-control" style="display: none;"></div>

                            <!-- Font Size Controls -->
                            <div class="font-size-control text-control">
                                <button class="icon-btn" onclick="changeFontSize(-1)">−</button>
                                <span class="font-size-display" id="fontSizeDisplayCollab"
                                    onclick="showFontSizePicker()">14</span>
                                <button class="icon-btn" onclick="changeFontSize(1)">+</button>
                            </div>

                            <select class="menu-select text-control" id="fontFamilyCollab" onchange="applyFormatting()">
                                <option value="'Times New Roman', serif">Times New Roman</option>
                                <option value="'Inter', sans-serif">Inter</option>
                                <option value="'Arial', sans-serif">Arial</option>
                            </select>

                            <div class="menu-separator"></div>

                            <!-- Text Formatting Buttons -->
                            <button class="icon-btn format-btn text-control" id="boldBtnCollab"
                                onclick="toggleFormat('bold')">B</button>
                            <button class="icon-btn format-btn text-control" id="italicBtnCollab"
                                onclick="toggleFormat('italic')">I</button>
                            <button class="icon-btn format-btn text-control" id="underlineBtnCollab"
                                onclick="toggleFormat('underline')">U</button>

                            <div class="menu-separator"></div>

                            <!-- Stroke Size Control -->
                            <div class="stroke-size-control draw-control" style="display: none;">
                                <button class="icon-btn" onclick="changeStrokeSize(-1)">−</button>
                                <span class="stroke-size-display" id="strokeSizeDisplayCollab">3</span>
                                <button class="icon-btn" onclick="changeStrokeSize(1)">+</button>
                            </div>

                            <!-- Color Picker -->
                            <div class="color-picker">
                                <button class="color-circle" data-color="black" onclick="selectColor('black')"
                                    style="background: black;"></button>
                                <button class="color-circle" data-color="red" onclick="selectColor('red')"
                                    style="background: red;"></button>
                                <button class="color-circle" data-color="blue" onclick="selectColor('blue')"
                                    style="background: blue;"></button>
                                <button class="color-circle" data-color="green" onclick="selectColor('green')"
                                    style="background: green;"></button>
                            </div>

                            <div class="menu-separator"></div>

                            <!-- Alignment Buttons -->
                            <div class="align-controls text-control">
                                <button class="icon-btn align-btn active" id="alignLeftCollab"
                                    onclick="setAlignment('left')">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path d="M2 3h12M2 6h12M2 9h8M2 12h12" stroke="#5f6368" stroke-width="1.5"
                                            stroke-linecap="round" />
                                    </svg>
                                </button>
                                <button class="icon-btn align-btn" id="alignCenterCollab"
                                    onclick="setAlignment('center')">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path d="M2 3h12M4 6h8M2 9h12M4 12h8" stroke="#5f6368" stroke-width="1.5"
                                            stroke-linecap="round" />
                                    </svg>
                                </button>
                                <button class="icon-btn align-btn" id="alignRightCollab"
                                    onclick="setAlignment('right')">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path d="M2 3h12M2 6h12M6 9h8M2 12h12" stroke="#5f6368" stroke-width="1.5"
                                            stroke-linecap="round" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="container">
                            <div class="page-wrapper">
                                <div id="textEditorCollab" contenteditable="true" class="text-editor a4-page"
                                    spellcheck="false"></div>

                                <div id="canvasContainerCollab" style="display: none;">
                                    <canvas id="drawingCanvasCollab"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
            <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
            <script src="shapes.js"></script>
            <script src="script.js"></script>

</body>

</html>
